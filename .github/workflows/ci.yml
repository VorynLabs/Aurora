name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rspec:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/aurora_test

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare database
        # db:test:prepare loads the schema without running the seeds. db:prepare
        # would seed a freshly created database, and specs must not depend on
        # rows they did not create themselves.
        run: bin/rails db:test:prepare

      - name: Build Tailwind
        # app/assets/builds/tailwind.css is generated, not committed, and every
        # view that renders a layout asks the asset pipeline for it.
        run: bin/rails tailwindcss:build

      - name: Run specs
        run: bundle exec rspec
